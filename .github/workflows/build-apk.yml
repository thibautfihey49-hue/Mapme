name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ☕ Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Générer le Gradle Wrapper officiellement
        run: |
          # Télécharger Gradle temporairement pour générer le wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.10.1-bin.zip
          unzip -q gradle-8.10.1-bin.zip
          ./gradle-8.10.1/bin/gradle wrapper --gradle-version=8.10.1
          chmod +x gradlew
          echo "✅ Wrapper généré : ./gradlew prêt"

      - name: 🏗️ Compiler l'APK Debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: ✅ Vérifier l'APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "ERROR: APK not found!"
            exit 1
          fi

      - name: 📤 Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Mapme-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
