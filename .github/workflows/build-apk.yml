name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Permet de lancer manuellement depuis GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ☕ Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Configurer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools,build-tools;35.0.0,android-platform-35

      - name: 🔖 Rendre Gradle executable
        run: chmod +x gradlew

      - name: 🏗️ Compiler l'APK Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: ✅ Vérifier l'APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: 📤 Télécharger l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: Mapme-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
